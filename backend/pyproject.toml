[project]
name = "pm-backend"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163.2",
    "itsdangerous>=2.2.0",
    "openai>=3.54.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["live: calls the real OpenRouter API (needs OPENROUTER_API_KEY)"]
